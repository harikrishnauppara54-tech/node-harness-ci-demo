pipeline:
  name: node-harness-ci-demo
  identifier: node_harness_ci_demo
  projectIdentifier: default
  orgIdentifier: default
  properties:
    ci:
      codebase:
        connectorRef: account.GitHub
        repoName: harikrishnauppara54-tech/node-harness-ci-demo
        build: <+input>

stages:
  - stage:
      name: Build and Test
      identifier: build_and_test
      description: Install dependencies, run tests, and package the Node.js app
      type: CI
      spec:
        cloneCodebase: true
        execution:
          steps:
            - step:
                type: Run
                name: Set up Node.js
                identifier: setup_node
                spec:
                  shell: Sh
                  command: |
                    node -v
                    npm -v
                    npm config set fund false

            - step:
                type: Run
                name: Install dependencies
                identifier: install_deps
                spec:
                  shell: Sh
                  command: |
                    npm ci

            - step:
                type: Run
                name: Run tests
                identifier: run_tests
                spec:
                  shell: Sh
                  command: |
                    npm test -- --runInBand

            - step:
                type: Run
                name: Build application
                identifier: build_app
                spec:
                  shell: Sh
                  command: |
                    npm run build

        platform:
          os: Linux
          arch: Amd64

        runtime:
          type: Cloud
          spec: {}

        caching:
          enabled: true
          paths:
            - /root/.npm

  - stage:
      name: Publish Docker image
      identifier: publish_docker_image
      description: Build and push the application image to Docker Hub
      type: CI
      spec:
        cloneCodebase: false
        execution:
          steps:
            - step:
                type: BuildAndPushDockerRegistry
                name: Build and push Docker image
                identifier: build_push_docker
                spec:
                  connectorRef: account.dockerhub
                  repo: harikrishnauppara54-tech/node-harness-ci-demo
                  tags:
                    - <+pipeline.sequenceId>
                    - latest
                  dockerfile: Dockerfile
                  context: .
                  buildArgs: {}

        platform:
          os: Linux
          arch: Amd64

        runtime:
          type: Cloud
          spec: {}
